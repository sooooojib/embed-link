FF8C00\">Class C:</span> <code>255.255.255.0</code>","children":[],"payload":{"tag":"li","lines":"61,63"}}],"payload":{"tag":"li","lines":"58,63"}}],"payload":{"tag":"h2","lines":"52,53"}},{"content":"<span style=\"color:#2E8B57\">5. Special IP Addresses</span>","children":[{"content":"<strong>Network Address</strong>: Hostid is all <code>0</code>s <em>(Identifies the network)</em>","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"<strong>Direct Broadcast</strong>: Hostid is all <code>1</code>s <em>(Delivered to all hosts on a specific network)</em>","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"<strong>Limited Broadcast</strong>: <code>255.255.255.255</code> <em>(Delivered to all hosts on local segment; not forwarded)</em>","children":[],"payload":{"tag":"li","lines":"67,68"}},{"content":"<strong>This Host on This Network</strong>: <code>0.0.0.0</code> <em>(Used when a host boots up / DHCP)</em>","children":[],"payload":{"tag":"li","lines":"68,69"}},{"content":"<strong>Loopback Address</strong>: Netid is <code>127</code> <em>(Loops back inside host&apos;s IP stack for testing)</em>","children":[],"payload":{"tag":"li","lines":"69,71"}}],"payload":{"tag":"h2","lines":"63,64"}},{"content":"<span style=\"color:#2E8B57\">6. Subnetting</span>","children":[{"content":"\n<p data-lines=\"73,74\"><strong><span style=\"color:#8A2BE2\">Concept</span></strong></p>","children":[{"content":"Solves address wastage by borrowing bits from <code>Hostid</code>","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"Creates 3-level hierarchy: <code>&lt;span style=&quot;color:#FF8C00&quot;&gt;Netid | Subnetid | Hostid&lt;/span&gt;</code>","children":[],"payload":{"tag":"li","lines":"75,77"}}],"payload":{"tag":"li","lines":"73,77"}},{"content":"\n<p data-lines=\"77,78\"><strong><span style=\"color:#8A2BE2\">Subnet Address Calculation</span></strong></p>","children":[{"content":"IP Address <strong><span style=\"color:#DC143C\">AND</span></strong> Subnet Mask","children":[],"payload":{"tag":"li","lines":"78,80"}}],"payload":{"tag":"li","lines":"77,80"}},{"content":"\n<p data-lines=\"80,81\"><strong><span style=\"color:#8A2BE2\">Designing Subnets (Steps)</span></strong></p>","children":[{"content":"<strong>1. Borrow Bits:</strong> Find smallest <code>n</code> where <code>2^n &gt;= required subnets</code>","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"<strong>2. New Mask:</strong> Add borrowed &apos;1&apos;s to the default mask","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"<strong>3. Addresses per Subnet:</strong> <code>2^(remaining host bits)</code>","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"<strong>4. List Ranges:</strong> Network Address to Broadcast Address","children":[],"payload":{"tag":"li","lines":"84,86"}}],"payload":{"tag":"li","lines":"80,86"}}],"payload":{"tag":"h2","lines":"71,72"}},{"content":"<span style=\"color:#2E8B57\">7. CIDR (Classless Interdomain Routing)</span>","children":[{"content":"\n<p data-lines=\"88,89\"><strong><span style=\"color:#8A2BE2\">Concept</span></strong></p>","children":[{"content":"Eliminates rigid A, B, and C classes","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"Uses <strong>prefix length / slash notation</strong> (e.g., <code>/n</code>) to define boundary","children":[],"payload":{"tag":"li","lines":"90,92"}}],"payload":{"tag":"li","lines":"88,92"}},{"content":"\n<p data-lines=\"92,93\"><strong><span style=\"color:#8A2BE2\">Benefits</span></strong></p>","children":[{"content":"<strong>Efficient Allocation:</strong> Variable-length blocks tailored to need","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"<strong>Route Aggregation:</strong> Keeps global routing tables manageable","children":[],"payload":{"tag":"li","lines":"94,96"}}],"payload":{"tag":"li","lines":"92,96"}}],"payload":{"tag":"h2","lines":"86,87"}},{"content":"<span style=\"color:#2E8B57\">8. Working with CIDR Blocks</span>","children":[{"content":"\n<p data-lines=\"98,99\"><strong>Find First Address (Network)</strong></p>","children":[{"content":"Keep first <code>n</code> bits of address, set all subsequent bits to <code>0</code>","children":[],"payload":{"tag":"li","lines":"99,101"}}],"payload":{"tag":"li","lines":"98,101"}},{"content":"\n<p data-lines=\"101,102\"><strong>Find Number of Addresses</strong></p>","children":[{"content":"Formula: <code>2^(32 - n)</code>","children":[],"payload":{"tag":"li","lines":"102,104"}}],"payload":{"tag":"li","lines":"101,104"}},{"content":"\n<p data-lines=\"104,105\"><strong>Find Last Address (Broadcast)</strong></p>","children":[{"content":"Set all host bits to <code>1</code>","children":[],"payload":{"tag":"li","lines":"105,106"}},{"content":"<em>Method 1:</em> Addition (First Address + Offset)","children":[],"payload":{"tag":"li","lines":"106,107"}},{"content":"<em>Method 2:</em> Mask Complement (First Address + inverted mask)","children":[],"payload":{"tag":"li","lines":"107,109"}}],"payload":{"tag":"li","lines":"104,109"}}],"payload":{"tag":"h2","lines":"96,97"}},{"content":"<span style=\"color:#2E8B57\">9. Summary: Transition to Classless</span>","children":[{"content":"<strong>Classful</strong>: Simple but rigid and wasteful","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"<strong>Subnetting</strong>: Internal hierarchy, but still bounded by legacy classes","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"<strong>CIDR</strong>: Abstracted address classes entirely","children":[{"content":"Enabled <strong>Efficient Address Allocation</strong>","children":[],"payload":{"tag":"li","lines":"114,115"}},{"content":"Enabled <strong>Route Aggregation</strong>","children":[],"payload":{"tag":"li","lines":"115,116"}}],"payload":{"tag":"li","lines":"113,116"}}],"payload":{"tag":"h2","lines":"109,110"}}],"payload":{"tag":"h1","lines":"6,7"}},{"spacingVertical":30,"spacingHorizontal":120})
